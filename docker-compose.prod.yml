services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hiringarrow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mail -d hiringarrow"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  migrate:
    build: .
    command: node scripts/migrate.js
    env_file: .env
    environment: &env
      DATABASE_URL: postgres://mail:${POSTGRES_PASSWORD}@postgres:5432/hiringarrow
      REDIS_URL: redis://redis:6379
    depends_on: { postgres: { condition: service_healthy } }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *env
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  worker:
    build: .
    restart: unless-stopped
    command: node src/worker.js
    env_file: .env
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
volumes: { pgdata: {}, redisdata: {} }
